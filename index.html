<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
  <style>
   
  </style>
</head>
<body>




    <body class="dark">

  <div class="theme-toggle" onclick="toggleTheme()">
    🌙
  </div>

<div class="calculator">
  <div class="display" id="display">0</div>
  <div class="buttons">
    <button onclick="clearDisplay(); playSound()">C</button>
    <button onclick="deleteLast(); playSound()">⌫</button>
    <button onclick="appendPercent()">%</button>
    <button onclick="append('/'); playSound()">÷</button>

    <button onclick="append('7'); playSound()">7</button>
    <button onclick="append('8'); playSound()">8</button>
    <button onclick="append('9'); playSound()">9</button>
    <button onclick="append('*'); playSound()">×</button>

    <button onclick="append('4'); playSound()">4</button>
    <button onclick="append('5'); playSound()">5</button>
    <button onclick="append('6'); playSound()">6</button>
    <button onclick="append('-'); playSound()">−</button>

    <button onclick="append('1'); playSound()">1</button>
    <button onclick="append('2'); playSound()">2</button>
    <button onclick="append('3'); playSound()">3</button>
    <button onclick="append('+'); playSound()">+</button>

    <button onclick="append('0'); playSound()">0</button>
    <button onclick="append('.'); playSound()">.</button>
  
  
    <!-- Equal (=) button sound -->
<audio id="equalSound" src="sounds-of-button-selection-in-the-game-menu-sound-effect_O6RnNi9F.mp3"></audio>

<!-- Equal button -->

<button class="equal" onclick="calculatePercentageOf(); playEqualSound()">=</button>


  </div>
</div>

<!-- Beep sound (hidden audio) -->
<audio id="btnSound" src="click-sound-effect_whufFJN4.mp3"></audio>



<!-- Display for recognized text -->
<p id="voiceText"></p>

<!-- 🎤 Mic Button -->
<button id="micBtn" onclick="startVoice()">🎤 SPEAK HERE....</button>

<!-- Beep Sound (hidden) -->
<audio id="beepSound" src="Google Mic Activation & Ready To Speak Sound Effect.mp3"></audio>






    

 <script src="node.js"></script>
</body>
</html>
